<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="1440" height="800">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="40%" stop-color="#4DA6FF"/>
      <stop offset="100%" stop-color="#87CEEB"/>
    </linearGradient>
    <!-- Ocean gradient -->
    <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#006994"/>
      <stop offset="50%" stop-color="#005F8A"/>
      <stop offset="100%" stop-color="#004A6E"/>
    </linearGradient>
    <!-- Shallow reef gradient -->
    <linearGradient id="reef" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#40E0D0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#008080" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Island green -->
    <linearGradient id="islandGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="30%" stop-color="#3CB371"/>
      <stop offset="60%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#1a6b34"/>
    </linearGradient>
    <!-- Phosphate areas -->
    <linearGradient id="phosphate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C5A0"/>
      <stop offset="50%" stop-color="#C4B581"/>
      <stop offset="100%" stop-color="#B8A87A"/>
    </linearGradient>
    <!-- Sand/bare ground -->
    <linearGradient id="sand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FFE082" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
    </radialGradient>
    <!-- Water shimmer -->
    <filter id="shimmer">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="8"/>
    </filter>
    <!-- Soft blur for clouds -->
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="cloudBlurLight">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1440" height="800" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1200" cy="120" r="60" fill="url(#sunGlow)"/>
  <circle cx="1200" cy="120" r="30" fill="#FFF9C4" opacity="0.9"/>

  <!-- Clouds -->
  <g filter="url(#cloudBlur)" opacity="0.4">
    <ellipse cx="300" cy="100" rx="180" ry="30" fill="#FFFFFF"/>
    <ellipse cx="350" cy="85" rx="120" ry="25" fill="#FFFFFF"/>
    <ellipse cx="220" cy="95" rx="100" ry="20" fill="#FFFFFF"/>
  </g>
  <g filter="url(#cloudBlur)" opacity="0.3">
    <ellipse cx="900" cy="70" rx="200" ry="35" fill="#FFFFFF"/>
    <ellipse cx="970" cy="55" rx="140" ry="28" fill="#FFFFFF"/>
  </g>
  <g filter="url(#cloudBlurLight)" opacity="0.25">
    <ellipse cx="600" cy="50" rx="160" ry="22" fill="#FFFFFF"/>
  </g>

  <!-- Ocean horizon -->
  <rect y="420" width="1440" height="380" fill="url(#ocean)"/>

  <!-- Ocean waves / texture -->
  <g opacity="0.15">
    <path d="M0 450 Q50 445 100 450 T200 450 T300 450 T400 450 T500 450 T600 450 T700 450 T800 450 T900 450 T1000 450 T1100 450 T1200 450 T1300 450 T1400 450" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M0 500 Q60 493 120 500 T240 500 T360 500 T480 500 T600 500 T720 500 T840 500 T960 500 T1080 500 T1200 500 T1320 500 T1440 500" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M0 560 Q40 555 80 560 T160 560 T240 560 T320 560 T400 560 T480 560 T560 560 T640 560 T720 560 T800 560 T880 560 T960 560 T1040 560 T1120 560 T1200 560 T1280 560 T1360 560 T1440 560" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Sun reflection on water -->
  <g opacity="0.3">
    <ellipse cx="1200" cy="500" rx="60" ry="80" fill="#FFF9C4"/>
  </g>

  <!-- Coral reef (turquoise ring around island) -->
  <ellipse cx="720" cy="530" rx="520" ry="170" fill="url(#reef)"/>
  <ellipse cx="720" cy="530" rx="480" ry="155" fill="url(#reef)" opacity="0.5"/>

  <!-- Foam break on reef -->
  <ellipse cx="720" cy="530" rx="490" ry="158" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.3"/>

  <!-- Island shape (Nauru profile - oval with irregular edges) -->
  <g transform="translate(720, 530)">
    <!-- Main island body -->
    <path d="M-180,-40 
             Q-170,-80 -140,-100 
             Q-110,-120 -70,-115 
             Q-30,-110 0,-120 
             Q40,-130 80,-115 
             Q120,-100 150,-75 
             Q175,-50 185,-15 
             Q195,20 185,55 
             Q175,85 150,100 
             Q120,115 80,120 
             Q40,125 0,120 
             Q-40,115 -80,105 
             Q-120,90 -150,65 
             Q-175,40 -180,0 Z" 
          fill="url(#islandGreen)"/>

    <!-- Sand/beach edges -->
    <path d="M-180,-40 
             Q-170,-80 -140,-100 
             Q-110,-120 -70,-115 
             Q-30,-110 0,-120 
             Q40,-130 80,-115 
             Q120,-100 150,-75 
             Q175,-50 185,-15 
             Q195,20 185,55 
             Q175,85 150,100 
             Q120,115 80,120 
             Q40,125 0,120 
             Q-40,115 -80,105 
             Q-120,90 -150,65 
             Q-175,40 -180,0 Z" 
          fill="none" stroke="#F5DEB3" stroke-width="6" opacity="0.6"/>

    <!-- Phosphate mining areas (lighter, bare ground patches) -->
    <path d="M-60,-60 Q-30,-70 0,-55 Q20,-40 10,-20 Q0,0 -20,-10 Q-40,-20 -50,-40 Z" fill="url(#phosphate)" opacity="0.7"/>
    <path d="M60,-40 Q80,-50 100,-35 Q110,-20 95,-5 Q80,10 60,0 Q50,-15 55,-30 Z" fill="url(#phosphate)" opacity="0.6"/>
    <path d="M-100,10 Q-80,5 -70,20 Q-60,35 -80,40 Q-100,35 -105,20 Z" fill="url(#phosphate)" opacity="0.5"/>
    <path d="M40,40 Q60,35 75,50 Q80,65 60,70 Q40,65 35,50 Z" fill="url(#sand)" opacity="0.5"/>

    <!-- Interior green vegetation texture -->
    <circle cx="-80" cy="-50" r="30" fill="#1a6b34" opacity="0.4"/>
    <circle cx="50" cy="-70" r="25" fill="#1a6b34" opacity="0.3"/>
    <circle cx="-30" cy="-30" r="20" fill="#2E8B57" opacity="0.3"/>
    <circle cx="90" cy="-20" r="18" fill="#2E8B57" opacity="0.25"/>

    <!-- Topographic contour lines -->
    <path d="M-120,-20 Q-80,-60 0,-70 Q80,-60 120,-20 Q80,20 0,30 Q-80,20 -120,-20" fill="none" stroke="#1a5a2a" stroke-width="1" opacity="0.2"/>
    <path d="M-80,-10 Q-40,-40 0,-45 Q40,-40 80,-10 Q40,10 0,15 Q-40,10 -80,-10" fill="none" stroke="#1a5a2a" stroke-width="1" opacity="0.15"/>

    <!-- Small lake / Buada Lagoon -->
    <ellipse cx="-20" cy="-10" rx="18" ry="10" fill="#4A90D9" opacity="0.5"/>
    <ellipse cx="-20" cy="-10" rx="14" ry="7" fill="#6BB3E0" opacity="0.4"/>
  </g>

  <!-- Beach edge detail -->
  <ellipse cx="720" cy="530" rx="200" ry="125" fill="none" stroke="#F5DEB3" stroke-width="2" opacity="0.3"/>

  <!-- Additional foreground waves -->
  <g opacity="0.12">
    <path d="M0 620 Q80 612 160 620 T320 620 T480 620 T640 620 T800 620 T960 620 T1120 620 T1280 620 T1440 620" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M0 680 Q60 675 120 680 T240 680 T360 680 T480 680 T600 680 T720 680 T840 680 T960 680 T1080 680 T1200 680 T1320 680 T1440 680" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Top gradient overlay for atmosphere -->
  <rect width="1440" height="200" fill="url(#sunGlow)" opacity="0.08"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="1440" height="800" fill="url(#vignette)"/>
</svg>
