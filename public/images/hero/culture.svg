  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect y="150" width="1200" height="100" fill="url(#stripe)"/>
  <circle cx="600" cy="200" r="80" fill="none" stroke="#FFC72C" stroke-width="2" opacity="0.4"/>
  <text x="600" y="140" text-anchor="middle" fill="#FFC72C" font-family="Georgia, serif" font-size="48" font-weight="bold">Culture & Heritage</text>
  <text x="600" y="260" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="18">The soul of Nauru</text>
