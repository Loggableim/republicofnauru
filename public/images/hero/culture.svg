<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#002B7F"/>
      <stop offset="100%" stop-color="#001547"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
