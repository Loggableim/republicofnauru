<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#002B7F"/>
      <stop offset="42%" stop-color="#002B7F"/>
      <stop offset="42%" stop-color="#FFC72C"/>
      <stop offset="58%" stop-color="#FFC72C"/>
      <stop offset="58%" stop-color="#002B7F"/>
      <stop offset="100%" stop-color="#002B7F"/>
    </linearGradient>
  </defs>
  <!-- Circle background with flag gradient -->
  <circle cx="64" cy="64" r="60" fill="url(#flagGrad)"/>
  <!-- White 12-point star (Nauru flag) -->
  <g transform="translate(64,64)">
    <polygon points="0,-22 3.5,-7.5 16,-7.5 6,2 10,16 0,7 -10,16 -6,2 -16,-7.5 -3.5,-7.5" fill="#FFFFFF"/>
  </g>
  <!-- Simplified palm tree silhouette in bottom-right -->
  <g transform="translate(38,48) scale(0.6)">
    <!-- Trunk -->
    <path d="M40 70 Q38 50 42 30 Q40 20 38 10" fill="none" stroke="#002B7F" stroke-width="5" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M38 10 Q20 5 8 15" fill="none" stroke="#002B7F" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 10 Q25 0 15 5" fill="none" stroke="#002B7F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M38 10 Q50 2 60 10" fill="none" stroke="#002B7F" stroke-width="4" stroke-linecap="round"/>
    <path d="M38 10 Q55 -2 65 0" fill="none" stroke="#002B7F" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M38 10 Q30 15 20 25" fill="none" stroke="#002B7F" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 10 Q48 15 55 22" fill="none" stroke="#002B7F" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Gloss highlight -->
  <circle cx="44" cy="40" r="28" fill="#FFFFFF" opacity="0.06"/>
</svg>
